name: Bug report / 缺陷反馈
description: Report a reproducible problem with UU Remote Web. / 反馈可复现的问题。
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a new one.

        Do not include SMS codes, exported login-state JSON, UU tokens, room tokens, complete device IDs, private IP addresses, or unredacted request and response bodies. Send security reports to `iola1999@foxmail.com`.

        提交前请先搜索已有 Issue。请勿粘贴短信验证码、账号凭证 JSON、UU Token、房间 Token、完整设备 ID、私网地址或未经脱敏的请求和响应。安全问题请发送至 `iola1999@foxmail.com`。
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment / 部署方式
      options:
        - Self-hosted Cloudflare Worker
        - Self-hosted Docker
        - Local development server
        - Public instance (uurc.678234.xyz)
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision / 版本或提交
      description: Provide the Docker tag, deployment date, or commit hash when available.
      placeholder: "main at abc1234, Docker latest, or deployed YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system / 浏览器与系统
      placeholder: "Chrome 138 on macOS 15; controlled device: Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Provide the shortest sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Connect to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 诊断信息
      description: Include the connection stage, route mode, browser console error, or relevant server log after redacting sensitive values.
      placeholder: "Connection stage, direct/relay path, and redacted error output"
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data / 敏感信息
      options:
        - label: I removed account credentials, tokens, SMS codes, device identifiers, private addresses, and other sensitive data. / 我已移除账号凭证、Token、验证码、设备标识、私网地址及其他敏感信息。
          required: true
